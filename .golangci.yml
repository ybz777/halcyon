run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gofmt
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused

linters-settings:
  staticcheck:
    checks: ["all"]
  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: error-return
      - name: exported
        disabled: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
