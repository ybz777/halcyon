version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /pkg/platform
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /services/auth
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /services/gateway
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /services/jobs
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /tests/integration
    schedule:
      interval: weekly
