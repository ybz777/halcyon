openapi: 3.0.3
info:
  title: Halcyon Jobs API
  version: v1
security:
  - bearerAuth: []
paths:
  /api/v1/jobs:
    get:
      summary: List jobs
      security:
        - bearerAuth: []
      parameters:        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: cursor
          schema:
            type: string
      responses:
        '200':
          description: Job page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionPage'
        '400':
          description: Invalid cursor or page size
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
  /api/v1/jobs/{id}:
    get:
      summary: Get job
      security:
        - bearerAuth: []
      parameters:        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job details
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '404':
          description: Job not found
  /api/v1/jobs/{id}/cancel:
    post:
      summary: Cancel job
      security:
        - bearerAuth: []
      parameters:        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Cancelled
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
  /api/v1/jobs/{id}/attempts:
    get:
      summary: List job attempts
      security:
        - bearerAuth: []
      parameters:        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: cursor
          schema:
            type: string
      responses:
        '200':
          description: Attempt history page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionPage'
        '400':
          description: Invalid cursor or page size
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Auth service access token
  schemas:    CollectionPage:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
        next_cursor:
          type: string
        has_more:
          type: boolean
